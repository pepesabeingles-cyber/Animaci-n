<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>∞</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    canvas { display: block; touch-action: none; }
    #music {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,150,200,0.5);
      background: rgba(40,10,30,0.4); color: #ffaad0;
      font-size: 20px; cursor: pointer; backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s;
    }
    #music:hover { transform: scale(1.1); background: rgba(80,20,50,0.6); }
    #hint {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: rgba(255,180,210,0.85); font-family: system-ui, sans-serif;
      font-size: 14px; letter-spacing: 1px; pointer-events: none;
      text-shadow: 0 0 10px rgba(255,80,150,0.7); animation: pulseHint 2s infinite;
    }
    @keyframes pulseHint { 0%,100%{opacity:0.45} 50%{opacity:1} }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<button id="music" aria-label="música">♪</button>
<div id="hint">toca la pantalla para la melodía 🎵</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy, DPR;

function resize() {
  // Backing store a resolución real del dispositivo → nitidez al acercar
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); buildStars(); buildNebula(); buildHeartConstellation(); buildTextStars(); });

// ─────────────────────────────────────────────
//  ZOOM
// ─────────────────────────────────────────────
let zoom = 1, targetZoom = 1;
const ZOOM_MIN = 0.06, ZOOM_MAX = 5;
window.addEventListener('wheel', e => {
  targetZoom *= e.deltaY > 0 ? 0.88 : 1.14;
  targetZoom  = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom));
}, { passive: true });
let lastPinchDist = null;
function pinchDist(e) {
  return Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY);
}
canvas.addEventListener('touchstart',  e => { if (e.touches.length === 2) lastPinchDist = pinchDist(e); }, { passive: true });
canvas.addEventListener('touchmove',   e => {
  if (e.touches.length === 2) {
    e.preventDefault(); // bloquea el zoom de página del navegador
    if (lastPinchDist) {
      const d = pinchDist(e); targetZoom *= d / lastPinchDist;
      targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom));
    }
    lastPinchDist = pinchDist(e);
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { lastPinchDist = null; }, { passive: true });
// iOS Safari: evita el gesto de zoom nativo
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

// ─────────────────────────────────────────────
//  CAPA 1 · ESTRELLAS
// ─────────────────────────────────────────────
let stars = [];
function buildStars() {
  stars = [];
  for (let i = 0; i < 800; i++) {
    const r = Math.random();
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r:     r < 0.6 ? 0.4 : r < 0.9 ? 0.8 : 1.4,
      alpha: 0.3 + Math.random() * 0.7,
      ts:    0.004 + Math.random() * 0.018,
      to:    Math.random() * Math.PI * 2,
      hue:   [200, 210, 220, 60, 340][Math.floor(Math.random() * 5)],
    });
  }
}
buildStars();

function drawStars(t) {
  for (const s of stars) {
    const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.ts + s.to));
    ctx.fillStyle = `hsla(${s.hue},80%,96%,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─────────────────────────────────────────────
//  ESTRELLAS QUE FORMAN "TE AMO" (constelación texto)
// ─────────────────────────────────────────────
// Cada letra es una matriz 5×7 (# = estrella)
const GLYPHS = {
  T: ["#####","..#..","..#..","..#..","..#..","..#..","..#.."],
  E: ["#####","#....","#....","####.","#....","#....","#####"],
  A: [".###.","#...#","#...#","#####","#...#","#...#","#...#"],
  M: ["#...#","##.##","#.#.#","#.#.#","#...#","#...#","#...#"],
  O: [".###.","#...#","#...#","#...#","#...#","#...#",".###."],
  " ": ["...","...","...","...","...","...","..."],
};

let textStars = [];
let textLetters = [];   // estrellas agrupadas por letra (para trazar líneas)
function buildTextStars() {
  textStars = [];
  textLetters = [];
  const word = "TE AMO";
  let totalCols = 0;
  for (let i = 0; i < word.length; i++) {
    totalCols += GLYPHS[word[i]][0].length;
    if (i < word.length - 1) totalCols += 1;
  }
  // MÁS GRANDE: ocupa hasta 90% del ancho y celdas más altas
  const cell = Math.min((W * 0.90) / totalCols, H * 0.050);
  const startX = cx - (totalCols * cell) / 2;
  const baseY  = H * 0.26 - (7 * cell) / 2;

  let colCursor = 0;
  for (let i = 0; i < word.length; i++) {
    const glyph = GLYPHS[word[i]];
    const gW = glyph[0].length;
    const letterPts = [];
    for (let row = 0; row < glyph.length; row++) {
      for (let col = 0; col < gW; col++) {
        if (glyph[row][col] === '#') {
          const st = {
            x: startX + (colCursor + col) * cell + cell / 2,
            y: baseY + row * cell + cell / 2,
            r: Math.max(2.2, cell * 0.22),
            to: Math.random() * Math.PI * 2,
            ts: 0.02 + Math.random() * 0.03,
          };
          textStars.push(st);
          letterPts.push(st);
        }
      }
    }
    if (letterPts.length) textLetters.push(letterPts);
    colCursor += gW + 1;
  }
}
buildTextStars();

function drawTextStars(t) {
  // latido marcado (más contraste entre claro y tenue)
  const beat = Math.pow(0.5 + 0.5 * Math.sin(t * 0.05), 1.5); // pulso tipo corazón
  const breathe = 0.72 + 0.28 * Math.sin(t * 0.006);
  const glowBoost = 0.6 + 0.4 * beat;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; // los brillos se suman → resalta

  // líneas que unen las estrellas dentro de cada letra
  ctx.strokeStyle = `rgba(255,130,180,${0.22 + beat * 0.22})`;
  ctx.lineWidth   = 1.4;
  for (const letter of textLetters) {
    for (let i = 0; i < letter.length; i++) {
      for (let j = i + 1; j < letter.length; j++) {
        const dx = letter[i].x - letter[j].x;
        const dy = letter[i].y - letter[j].y;
        // solo conecta estrellas vecinas
        if (dx * dx + dy * dy < (textStars[0].r * 14) ** 2) {
          ctx.beginPath();
          ctx.moveTo(letter[i].x, letter[i].y);
          ctx.lineTo(letter[j].x, letter[j].y);
          ctx.stroke();
        }
      }
    }
  }

  for (const s of textStars) {
    const tw = 0.8 + 0.2 * Math.sin(t * s.ts + s.to);
    const a  = breathe * tw;
    const R  = s.r;
    // halo rosado grande y luminoso
    const haloR = R * 6 * glowBoost;
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, haloR);
    g.addColorStop(0,   `rgba(255,180,215,${a})`);
    g.addColorStop(0.3, `rgba(255,90,160,${a * 0.6})`);
    g.addColorStop(1,   'rgba(255,60,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, haloR, 0, Math.PI * 2); ctx.fill();
    // núcleo blanco brillante
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, a + 0.35)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ─────────────────────────────────────────────
//  CONSTELACIÓN CORAZÓN (fija, en fondo)
// ─────────────────────────────────────────────
let heartConstellation = [];
function buildHeartConstellation() {
  // 10 puntos que trazan un corazón en la esquina superior derecha
  const bx = W * 0.80, by = H * 0.18, s = Math.min(W, H) * 0.075;
  const pts = [
    [0,    -0.30], [0.50, -0.62], [1.00, -0.20], [0.70,  0.28],
    [0.35,  0.62], [0,     1.00], [-0.35, 0.62], [-0.70,  0.28],
    [-1.00,-0.20], [-0.50,-0.62],
  ];
  heartConstellation = pts.map(([nx, ny]) => ({ x: bx + nx*s, y: by + ny*s }));
}
buildHeartConstellation();

function drawHeartConstellation(t) {
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.008);
  const hc = heartConstellation;
  // líneas tenues
  ctx.strokeStyle = `rgba(255,140,180,${0.08 + pulse * 0.06})`;
  ctx.lineWidth   = 0.6;
  ctx.beginPath();
  ctx.moveTo(hc[0].x, hc[0].y);
  for (let i = 1; i < hc.length; i++) ctx.lineTo(hc[i].x, hc[i].y);
  ctx.closePath();
  ctx.stroke();
  // estrellas en cada punto
  for (const p of hc) {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 5);
    g.addColorStop(0,   `rgba(255,180,210,${0.6 + pulse * 0.4})`);
    g.addColorStop(1,   'rgba(255,100,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
  }
}

// ─────────────────────────────────────────────
//  CAPA 2 · NEBULOSAS (con tono rosa añadido)
// ─────────────────────────────────────────────
let nebulaClouds = [];
function buildNebula() {
  nebulaClouds = [
    { x: cx * 0.3, y: cy * 0.4, rx: W * 0.35, ry: H * 0.25, hue: 330, a: 0.08 }, // rosa amor
    { x: cx * 1.7, y: cy * 1.5, rx: W * 0.30, ry: H * 0.20, hue: 200, a: 0.06 },
    { x: cx * 1.1, y: cy * 0.6, rx: W * 0.20, ry: H * 0.30, hue: 290, a: 0.05 },
    { x: cx * 0.5, y: cy * 1.6, rx: W * 0.25, ry: H * 0.20, hue: 180, a: 0.05 },
    { x: cx * 1.4, y: cy * 0.3, rx: W * 0.18, ry: H * 0.15, hue: 350, a: 0.06 }, // magenta extra
  ];
}
buildNebula();

function drawNebula() {
  for (const n of nebulaClouds) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx, n.ry));
    g.addColorStop(0,   `hsla(${n.hue},70%,55%,${n.a})`);
    g.addColorStop(0.5, `hsla(${n.hue},60%,40%,${n.a * 0.4})`);
    g.addColorStop(1,   `hsla(${n.hue},50%,20%,0)`);
    ctx.save();
    ctx.scale(1, n.ry / n.rx);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(n.x, n.y * (n.rx / n.ry), n.rx, n.rx, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
//  CAPA 3 · GALAXIA PRINCIPAL
// ─────────────────────────────────────────────
const GALAXY_PARTICLES = 2200;
let gparticles = [];
function buildGalaxy() {
  gparticles = [];
  const arms = 3;
  for (let i = 0; i < GALAXY_PARTICLES; i++) {
    const arm   = Math.floor(Math.random() * arms);
    const dist  = 30 + Math.pow(Math.random(), 1.4) * 340;
    const angle = (arm / arms) * Math.PI * 2 + (dist / 340) * Math.PI * 3.5 + (Math.random()-0.5) * 0.7;
    const spread = (0.5 + Math.random()*0.5) * (dist*0.12);
    const bright = dist < 80;
    gparticles.push({
      baseX: Math.cos(angle)*dist + Math.cos(angle)*spread,
      baseY: Math.sin(angle)*dist*0.42 + Math.sin(angle)*spread*0.4,
      r:     bright ? 1.2 + Math.random() : 0.3 + Math.random()*1.1,
      alpha: bright ? 0.7 + Math.random()*0.3 : 0.2 + Math.random()*0.6,
      hue:   bright ? 50 + Math.random()*30 : [210,220,260,280,60,340][Math.floor(Math.random()*6)],
      sat:   bright ? 80 : 60 + Math.random()*40,
      lit:   bright ? 90 : 60 + Math.random()*40,
      speed: 0.00008 + Math.random()*0.00005,
    });
  }
}
buildGalaxy();

function drawGalaxy(t, camAngle) {
  // Glow base
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
  glow.addColorStop(0,    'rgba(255,240,180,0.55)');
  glow.addColorStop(0.15, 'rgba(255,200,100,0.25)');
  glow.addColorStop(0.4,  'rgba(180,130,255,0.12)');
  glow.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI*2); ctx.fill();

  // Pulso rosa romántico periódico
  const pinkPulse = Math.pow(Math.max(0, Math.sin(t * 0.0045)), 6);
  if (pinkPulse > 0.01) {
    const pg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 160 + pinkPulse*100);
    pg.addColorStop(0,   `rgba(255,100,180,${pinkPulse * 0.35})`);
    pg.addColorStop(0.5, `rgba(255,50,120,${pinkPulse * 0.12})`);
    pg.addColorStop(1,   'rgba(200,0,80,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(cx, cy, 160 + pinkPulse*100, 0, Math.PI*2); ctx.fill();
  }

  // Partículas espirales
  for (const p of gparticles) {
    const rot = t * p.speed + camAngle;
    const x   = cx + p.baseX * Math.cos(rot) - p.baseY * Math.sin(rot);
    const y   = cy + p.baseX * Math.sin(rot) + p.baseY * Math.cos(rot);
    ctx.fillStyle = `hsla(${p.hue},${p.sat}%,${p.lit}%,${p.alpha})`;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI*2); ctx.fill();
  }

  // Núcleo
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
  core.addColorStop(0,   'rgba(255,255,220,1)');
  core.addColorStop(0.4, 'rgba(255,210,120,0.8)');
  core.addColorStop(1,   'rgba(255,150,50,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI*2); ctx.fill();
}

// ─────────────────────────────────────────────
//  GALAXIAS DISTANTES
// ─────────────────────────────────────────────
const DISTANT_GALAXIES = [
  { dxm:  3.8, dym:  0.3, scl: 0.52, hOff:  50, spd: 0.00009 },
  { dxm: -3.4, dym: -0.7, scl: 0.38, hOff: -40, spd: 0.00013 },
  { dxm:  0.5, dym:  4.0, scl: 0.45, hOff:  95, spd: 0.00010 },
  { dxm: -0.6, dym: -3.8, scl: 0.33, hOff: -70, spd: 0.00015 },
  { dxm:  3.2, dym: -3.2, scl: 0.40, hOff: 130, spd: 0.00008 },
  { dxm: -3.0, dym:  3.4, scl: 0.48, hOff:-115, spd: 0.00011 },
  { dxm:  1.6, dym: -4.2, scl: 0.28, hOff: 200, spd: 0.00014 },
  { dxm: -4.2, dym:  1.4, scl: 0.36, hOff:-160, spd: 0.00009 },
  { dxm:  5.5, dym:  2.2, scl: 0.22, hOff: 170, spd: 0.00012 },
  { dxm: -5.0, dym: -2.5, scl: 0.25, hOff:-200, spd: 0.00010 },
];

function drawMiniGalaxy(gx, gy, scl, hOff, angle) {
  const R = 280 * scl;
  const halo = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
  halo.addColorStop(0,   `hsla(${50+hOff},80%,70%,0.28)`);
  halo.addColorStop(0.4, `hsla(${220+hOff},60%,45%,0.10)`);
  halo.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI*2); ctx.fill();
  for (let i = 0; i < 380; i++) {
    const arm  = i % 2, frac = i / 380;
    const dist = (0.04 + frac * 0.95) * R;
    const a    = arm * Math.PI + frac * Math.PI * 4.2 + angle + Math.sin(i * 7.31) * 0.22;
    const sp   = Math.sin(i * 13.71) * dist * 0.10;
    const px   = gx + Math.cos(a)*dist + sp;
    const py   = gy + Math.sin(a)*dist*0.36 + Math.cos(i*13.71)*sp*0.3;
    ctx.fillStyle = `hsla(${frac > 0.6 ? 200+hOff : 50+hOff},70%,80%,${(0.18+frac*0.55)*scl})`;
    ctx.fillRect(px-0.8, py-0.8, 1.6, 1.6);
  }
  const core = ctx.createRadialGradient(gx, gy, 0, gx, gy, 16*scl);
  core.addColorStop(0,   `hsla(${50+hOff},100%,98%,0.95)`);
  core.addColorStop(0.6, `hsla(${40+hOff},80%,70%,0.40)`);
  core.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(gx, gy, 16*scl, 0, Math.PI*2); ctx.fill();
}

// ─────────────────────────────────────────────
//  UTILIDADES
// ─────────────────────────────────────────────
function circle(x, y, r, fill, stroke, sw = 1) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if (fill)   { ctx.fillStyle   = fill;   ctx.fill();   }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}
function glowAt(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0,   color.replace(')', ',0.5)').replace('hsl', 'hsla'));
  g.addColorStop(0.5, color.replace(')', ',0.15)').replace('hsl', 'hsla'));
  g.addColorStop(1,   color.replace(')', ',0)').replace('hsl', 'hsla'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}

// Corazón vectorial (bezier clásico)
function drawHeart(x, y, s, color, alpha) {
  const sc = s / 95, ox = 75 * sc, oy = 72 * sc;
  ctx.save();
  ctx.translate(x - ox, y - oy);
  ctx.scale(sc, sc);
  ctx.beginPath();
  ctx.moveTo(75, 40);
  ctx.bezierCurveTo(75, 37, 70, 25, 50, 25);
  ctx.bezierCurveTo(20, 25, 20, 62.5, 20, 62.5);
  ctx.bezierCurveTo(20, 80, 40, 102, 75, 120);
  ctx.bezierCurveTo(110, 102, 130, 80, 130, 62.5);
  ctx.bezierCurveTo(130, 62.5, 130, 25, 100, 25);
  ctx.bezierCurveTo(85, 25, 75, 37, 75, 40);
  ctx.closePath();
  ctx.fillStyle   = color;
  ctx.globalAlpha = alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─────────────────────────────────────────────
//  CORAZONES CÓSMICOS FLOTANTES (pantalla)
// ─────────────────────────────────────────────
let cosmicHearts = [];

function spawnCosmicHeart() {
  // Nacen desde el centro o desde posición aleatoria
  const fromCenter = Math.random() < 0.5;
  const x = fromCenter ? cx + (Math.random()-0.5) * 200 : Math.random() * W;
  const y = fromCenter ? cy + (Math.random()-0.5) * 200 : H * 0.3 + Math.random() * H * 0.6;
  cosmicHearts.push({
    x, y,
    s:    6 + Math.random() * 18,
    vx:   (Math.random() - 0.5) * 0.4,
    vy:   -0.15 - Math.random() * 0.4,
    hue:  320 + Math.random() * 50,
    life: 1,
    rot:  (Math.random() - 0.5) * 0.3,
    rotV: (Math.random() - 0.5) * 0.008,
  });
}

function updateCosmicHearts(t) {
  // Más corazones: nacen más seguido y en grupos
  if (t % 14 === 0) {
    spawnCosmicHeart();
    spawnCosmicHeart();
    if (Math.random() < 0.6) spawnCosmicHeart();
    if (Math.random() < 0.3) spawnCosmicHeart();
  }

  cosmicHearts = cosmicHearts.filter(h => h.life > 0);
  for (const h of cosmicHearts) {
    h.x   += h.vx;
    h.y   += h.vy;
    h.rot += h.rotV;
    h.life -= 0.004;

    const alpha = h.life * (0.5 + 0.5 * Math.sin(h.life * Math.PI));
    const gR    = h.s * 3;

    // glow suave
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    const glowG = ctx.createRadialGradient(0, 0, 0, 0, 0, gR);
    glowG.addColorStop(0,   `hsla(${h.hue},100%,75%,${alpha * 0.45})`);
    glowG.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = glowG;
    ctx.beginPath(); ctx.arc(0, 0, gR, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // corazón con brillo interno
    ctx.save();
    ctx.shadowColor = `hsl(${h.hue},100%,70%)`;
    ctx.shadowBlur  = h.s * 2.5;
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    drawHeart(0, 0, h.s, `hsl(${h.hue},90%,70%)`, alpha * 0.85);
    // brillo interior más claro
    drawHeart(0, 0, h.s * 0.55, `hsl(${h.hue-10},100%,88%)`, alpha * 0.5);
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
//  ROSA VECTORIAL (espiral de pétalos + tallo)
// ─────────────────────────────────────────────
function drawRose(x, y, s, hue, alpha, withStem = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;

  // tallo y hojas (opcional, para rosas con tallo)
  if (withStem) {
    ctx.strokeStyle = `hsla(140,55%,38%,${alpha})`;
    ctx.lineWidth   = s * 0.10;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(0, s * 0.7);
    ctx.quadraticCurveTo(s * 0.25, s * 2.0, 0, s * 3.4);
    ctx.stroke();
    // hoja
    ctx.fillStyle = `hsla(135,50%,42%,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(s * 0.55, s * 1.7, s * 0.5, s * 0.22, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-s * 0.5, s * 2.4, s * 0.45, s * 0.2, 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // pétalos externos (sépalos abiertos)
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.3;
    ctx.fillStyle = `hsla(${hue},75%,52%,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5,
                s * 0.62, s * 0.40, a, 0, Math.PI * 2);
    ctx.fill();
  }
  // pétalos medios
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    ctx.fillStyle = `hsla(${hue},80%,60%,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * s * 0.28, Math.sin(a) * s * 0.28,
                s * 0.42, s * 0.30, a, 0, Math.PI * 2);
    ctx.fill();
  }
  // espiral central (el "remolino" de la rosa)
  ctx.strokeStyle = `hsla(${hue},85%,42%,${alpha})`;
  ctx.lineWidth   = s * 0.07;
  ctx.beginPath();
  for (let k = 0; k <= 40; k++) {
    const ang = k * 0.45;
    const rad = (k / 40) * s * 0.45;
    const sx  = Math.cos(ang) * rad;
    const sy  = Math.sin(ang) * rad;
    if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.stroke();
  // corazón brillante de la rosa
  ctx.fillStyle = `hsla(${hue},90%,75%,${alpha})`;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─────────────────────────────────────────────
//  ROSAS CÓSMICAS FLOTANTES
// ─────────────────────────────────────────────
let cosmicRoses = [];
function spawnCosmicRose() {
  // Igual que los corazones: nacen del centro o por toda la pantalla
  const fromCenter = Math.random() < 0.5;
  const x = fromCenter ? cx + (Math.random() - 0.5) * 220 : Math.random() * W;
  const y = fromCenter ? cy + (Math.random() - 0.5) * 220 : Math.random() * H;
  cosmicRoses.push({
    x, y,
    s: 7 + Math.random() * 14,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -0.15 - Math.random() * 0.4,
    hue: [340, 350, 0, 330, 320, 355][Math.floor(Math.random() * 6)],
    life: 1,
    rot: (Math.random() - 0.5) * 0.6,
    rotV: (Math.random() - 0.5) * 0.01,
    sway: Math.random() * Math.PI * 2,
  });
}
function updateCosmicRoses(t) {
  // Tan frecuentes como los corazones: grupos cada 14 frames
  if (t % 14 === 0) {
    spawnCosmicRose();
    spawnCosmicRose();
    if (Math.random() < 0.5) spawnCosmicRose();
  }
  cosmicRoses = cosmicRoses.filter(r => r.life > 0);
  for (const r of cosmicRoses) {
    r.sway += 0.02;
    r.x    += r.vx + Math.sin(r.sway) * 0.3;
    r.y    += r.vy;
    r.rot  += r.rotV;
    r.life -= 0.004;
    const alpha = r.life * (0.5 + 0.5 * Math.sin(r.life * Math.PI)) * 0.95;
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.shadowColor = `hsl(${r.hue},90%,60%)`;
    ctx.shadowBlur  = r.s * 1.2;
    drawRose(0, 0, r.s, r.hue, alpha);
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
//  PLANETAS
// ─────────────────────────────────────────────
function drawVolcanic(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.1, px, py, r);
  g.addColorStop(0,'#ff6a00'); g.addColorStop(0.4,'#c83200');
  g.addColorStop(0.8,'#6b1800'); g.addColorStop(1,'#2a0800');
  circle(px, py, r, g);
  ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = `rgba(255,${100+80*Math.sin(t*0.002)},0,0.7)`; ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const a = (i/5)*Math.PI*2 + t*0.0003;
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px+Math.cos(a+0.5)*r*0.6, py+Math.sin(a+0.5)*r*0.6,
                         px+Math.cos(a)*r*0.95,     py+Math.sin(a)*r*0.95);
    ctx.stroke();
  }
  ctx.restore();
  glowAt(px, py, r*2.2, 'hsl(20,100%,50%)');
}

function drawOcean(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0,'#4adde8'); g.addColorStop(0.3,'#1a8fbf');
  g.addColorStop(0.7,'#0a4a8a'); g.addColorStop(1,'#040f3a');
  circle(px, py, r, g);
  ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  for (const c of [{ox:-0.15,oy:-0.2,w:0.45,h:0.38},{ox:0.2,oy:0.1,w:0.35,h:0.30},{ox:-0.4,oy:0.3,w:0.28,h:0.22}]) {
    const lg = ctx.createRadialGradient(px+c.ox*r, py+c.oy*r, 0, px+c.ox*r, py+c.oy*r, c.w*r);
    lg.addColorStop(0,'#4a8c3f'); lg.addColorStop(0.5,'#2d6e28'); lg.addColorStop(1,'transparent');
    ctx.fillStyle = lg; ctx.beginPath();
    ctx.ellipse(px+c.ox*r, py+c.oy*r, c.w*r, c.h*r, 0.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 0.55;
  for (let i = 0; i < 4; i++) {
    const ca = (i/4)*Math.PI*2 + t*0.0004;
    const cg = ctx.createRadialGradient(px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, 0,
                                        px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, r*0.28);
    cg.addColorStop(0,'rgba(255,255,255,0.8)'); cg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = cg; ctx.beginPath();
    ctx.ellipse(px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, r*0.28, r*0.12, ca, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  glowAt(px, py, r*2.0, 'hsl(200,100%,60%)');
  const atm = ctx.createRadialGradient(px, py, r*0.85, px, py, r*1.08);
  atm.addColorStop(0,'rgba(100,200,255,0)'); atm.addColorStop(1,'rgba(100,200,255,0.25)');
  circle(px, py, r*1.08, atm);
}

function drawGasGiant(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.25, py-r*0.3, r*0.1, px, py, r);
  g.addColorStop(0,'#f5d78e'); g.addColorStop(0.2,'#e8a850');
  g.addColorStop(0.5,'#c97030'); g.addColorStop(0.8,'#8a4010'); g.addColorStop(1,'#3a1800');
  circle(px, py, r, g);
  ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  for (const b of [{oy:-0.55,h:0.18,a:0.35},{oy:-0.25,h:0.14,a:0.25},{oy:0.05,h:0.20,a:0.30},{oy:0.38,h:0.15,a:0.28}]) {
    ctx.fillStyle=`rgba(0,0,0,${b.a})`; ctx.fillRect(px-r, py+b.oy*r, r*2, b.h*r);
  }
  ctx.fillStyle='rgba(180,80,30,0.45)'; ctx.beginPath();
  ctx.ellipse(px+Math.cos(t*0.0002)*r*0.3, py+r*0.1, r*0.22, r*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(px, py); ctx.scale(1, 0.28);
  for (let ri = 0; ri < 3; ri++) {
    ctx.strokeStyle=`rgba(200,160,90,${0.35-ri*0.08})`; ctx.lineWidth=r*(0.14-ri*0.02);
    ctx.beginPath(); ctx.arc(0, 0, r*(1.5+ri*0.22), 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
  glowAt(px, py, r*2.5, 'hsl(35,80%,50%)');
}

function drawIce(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0,'#e8f8ff'); g.addColorStop(0.3,'#90d8f5');
  g.addColorStop(0.7,'#3090c0'); g.addColorStop(1,'#082040');
  circle(px, py, r, g);
  ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle='rgba(240,250,255,0.8)';
  ctx.beginPath(); ctx.ellipse(px, py-r*0.72, r*0.55, r*0.32, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px, py+r*0.78, r*0.45, r*0.25, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(180,230,255,0.5)'; ctx.lineWidth=0.8;
  for (let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a)*r,py+Math.sin(a)*r);ctx.stroke();}
  ctx.restore();
  glowAt(px, py, r*1.9, 'hsl(195,90%,70%)');
}

// ── Planeta Amor: cuarzo rosa con pétalos ─────
function drawAmorPlanet(px, py, r, t) {
  // superficie cuarzo rosa
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.35, r*0.05, px, py, r);
  g.addColorStop(0,   '#ffd6ee');
  g.addColorStop(0.25,'#ff8cbf');
  g.addColorStop(0.6, '#c03878');
  g.addColorStop(1,   '#4a0830');
  circle(px, py, r, g);

  // facetas cristalinas
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = 'rgba(255,200,230,0.28)'; ctx.lineWidth = 0.9;
  for (let i = 0; i < 10; i++) {
    const a = (i/10)*Math.PI*2 + t*0.0001;
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.lineTo(px+Math.cos(a)*r, py+Math.sin(a)*r); ctx.stroke();
  }
  // brillo interno
  const shine = ctx.createRadialGradient(px-r*0.4, py-r*0.4, 0, px-r*0.3, py-r*0.3, r*0.5);
  shine.addColorStop(0,'rgba(255,240,248,0.55)'); shine.addColorStop(1,'rgba(255,180,220,0)');
  ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // anillo de pétalos orbitando
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(1, 0.35);
  for (let i = 0; i < 16; i++) {
    const pa   = (i/16)*Math.PI*2 + t*0.0012;
    const pr   = r * 1.65 + Math.sin(t*0.002 + i*0.6) * 5;
    const pAlp = 0.45 + 0.3*Math.sin(t*0.003 + i*0.9);
    const hue  = 330 + (i % 3)*15;
    ctx.save();
    ctx.translate(Math.cos(pa)*pr, Math.sin(pa)*pr);
    ctx.rotate(pa + Math.PI*0.5);
    ctx.fillStyle = `hsla(${hue},85%,75%,${pAlp})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, 5, 2.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // corazón pequeño flotando sobre el planeta
  const hOff = Math.sin(t * 0.005) * 6;
  ctx.save();
  ctx.shadowColor = 'rgba(255,80,160,0.8)'; ctx.shadowBlur = 10;
  drawHeart(px, py - r - 14 + hOff, 10, 'rgba(255,100,170,0.9)', 0.85);
  ctx.restore();

  // atmósfera rosa
  glowAt(px, py, r*2.4, 'hsl(330,100%,65%)');
  const atm = ctx.createRadialGradient(px, py, r*0.88, px, py, r*1.12);
  atm.addColorStop(0,'rgba(255,150,200,0)'); atm.addColorStop(1,'rgba(255,150,200,0.22)');
  circle(px, py, r*1.12, atm);
}

function drawMoon(px, py, r) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0,'#d0d0c8'); g.addColorStop(0.6,'#909088'); g.addColorStop(1,'#404038');
  circle(px, py, r, g);
  ctx.fillStyle='rgba(40,40,35,0.35)';
  for (const c of [{ox:0.2,oy:-0.25,r:0.2},{ox:-0.3,oy:0.1,r:0.14},{ox:0.1,oy:0.3,r:0.12}]) {
    ctx.beginPath(); ctx.arc(px+c.ox*r, py+c.oy*r, c.r*r, 0, Math.PI*2); ctx.fill();
  }
}

function drawComet(px, py, angle, t, hue = 200, tailMult = 1) {
  const tailLen = (90 + 30*Math.sin(t*0.002)) * tailMult;
  const td = angle + Math.PI;
  const grad = ctx.createLinearGradient(px, py, px+Math.cos(td)*tailLen, py+Math.sin(td)*tailLen);
  grad.addColorStop(0,   `hsla(${hue},90%,80%,0.75)`);
  grad.addColorStop(0.4, `hsla(${hue},80%,60%,0.30)`);
  grad.addColorStop(1,   `hsla(${hue},70%,40%,0)`);
  ctx.save();
  ctx.lineWidth=6; ctx.strokeStyle=grad; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(td)*tailLen, py+Math.sin(td)*tailLen); ctx.stroke();
  ctx.lineWidth=2.5; ctx.strokeStyle=`hsla(${hue},90%,90%,0.22)`;
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(td+0.15)*tailLen*0.7, py+Math.sin(td+0.15)*tailLen*0.7); ctx.stroke();
  ctx.restore();
  glowAt(px, py, 16, `hsl(${hue},100%,80%)`);
  circle(px, py, 4, `hsl(${hue-10},100%,92%)`);
}

function drawCreature(px, py, t, id) {
  const flap = Math.sin(t*0.003 + id*1.7)*0.5 + 0.5;
  ctx.save(); ctx.translate(px, py);
  // criaturas con tono más cálido/rosa cerca del planeta amor
  ctx.fillStyle = `hsla(${330+id*25},80%,75%,0.75)`;
  ctx.beginPath(); ctx.ellipse(-5*(0.3+flap*0.7),-2, 7*(0.4+flap*0.6), 4,-0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5*(0.3+flap*0.7),-2, 7*(0.4+flap*0.6), 4, 0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsla(${350+id*20},60%,85%,0.9)`;
  ctx.beginPath(); ctx.ellipse(0,0,2,5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

let asteroids = [];
function buildAsteroids() {
  asteroids = [];

    asteroids.push({
      angle: Math.random()*Math.PI*2,
      dist:  0.92 + Math.random()*0.16,
      size:  0.8 + Math.random()*2.0,
      speed: (0.00012 + Math.random()*0.0001)*(Math.random()<0.5?1:-1),
      alpha: 0.5 + Math.random()*0.5,
    });
  }
}
buildAsteroids();

function drawAsteroids(t, minR, maxR, camAngle) {
  for (const a of asteroids) {
    const r   = minR + a.dist*(maxR-minR);
    const ang = a.angle + t*a.speed + camAngle;
    ctx.fillStyle=`rgba(160,145,120,${a.alpha})`;
    ctx.beginPath(); ctx.arc(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r*0.4, a.size, 0, Math.PI*2); ctx.fill();
  }
}

function drawOrbit(rx, ry, alpha=0.1) {
  ctx.strokeStyle=`rgba(140,160,200,${alpha})`; ctx.lineWidth=0.5; ctx.setLineDash([3,8]);
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
}

let audioCtx = null, masterGain = null, delayWet = null;
let musicOn = false, schedulerTimer = null;
let nextNoteTime = 0, step = 0;

const EIGHTH = 0.36;                 // duración de corchea (~83 BPM)
const ARP_PATTERN = [0, 1, 2, 3, 2, 3, 1, 2];

// Progresión E · B · C#m · A (cálida, romántica)
const PROGRESSION = [
  { bass: 82.41,  arp: [164.81, 207.65, 246.94, 329.63], pad: [164.81, 246.94] }, // E
  { bass: 123.47, arp: [246.94, 311.13, 369.99, 493.88], pad: [246.94, 369.99] }, // B
  { bass: 138.59, arp: [277.18, 329.63, 415.30, 554.37], pad: [277.18, 415.30] }, // C#m
  { bass: 110.00, arp: [220.00, 277.18, 329.63, 440.00], pad: [220.00, 329.63] }, // A
];

const MUSIC_VOL = 0.6;

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0001;
  masterGain.connect(audioCtx.destination);

  // eco suave (sensación de espacio/reverb)
  const delay = audioCtx.createDelay();
  delay.delayTime.value = EIGHTH * 0.75;
  const fb = audioCtx.createGain(); fb.gain.value = 0.30;
  delay.connect(fb); fb.connect(delay);
  delayWet = audioCtx.createGain(); delayWet.gain.value = 0.32;
  delay.connect(delayWet); delayWet.connect(masterGain);
  window._delayNode = delay;
}

// Desbloqueo del audio en iOS/Safari: un buffer mudo dentro del gesto
function unlockAudio() {
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
}

function note(freq, time, dur, vol, type = 'sine') {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  o.connect(g);
  g.connect(masterGain);
  g.connect(window._delayNode);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.start(time);
  o.stop(time + dur + 0.05);
}

function scheduleStep(s, time) {
  const bar = Math.floor(s / 8) % PROGRESSION.length;
  const pos = s % 8;
  const chord = PROGRESSION[bar];

  // arpegio (guitarra suave)
  note(chord.arp[ARP_PATTERN[pos]], time, 0.9, 0.16, 'triangle');

  // al inicio de cada compás: bajo + pad sostenido
  if (pos === 0) {
    note(chord.bass, time, 2.4, 0.18, 'sine');
    for (const p of chord.pad) note(p, time, 2.6, 0.05, 'sine');
  }
  // pequeño adorno melódico en contratiempo
  if (pos === 4) note(chord.arp[3] * 2, time, 0.7, 0.07, 'sine');
}

function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + 0.2) {
    scheduleStep(step, nextNoteTime);
    nextNoteTime += EIGHTH;
    step = (step + 1) % (PROGRESSION.length * 8);
  }
}

function startMusic() {
  if (!audioCtx) initAudio();
  unlockAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Fundido de entrada en CADA arranque (anclado correctamente)
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
  masterGain.gain.exponentialRampToValueAtTime(MUSIC_VOL, now + 2.0);

  nextNoteTime = now + 0.1;
  step = 0;
  clearInterval(schedulerTimer);
  schedulerTimer = setInterval(scheduler, 25);
  musicOn = true;
  document.getElementById('music').textContent = '♪';
}

function stopMusic() {
  clearInterval(schedulerTimer);
  if (masterGain) {
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
  }
  musicOn = false;
  document.getElementById('music').textContent = '🔇';
}

function toggleMusic() {
  if (musicOn) stopMusic();
  else startMusic();
}

// Iniciar con el primer toque/clic (requisito de los navegadores)
function firstGesture() {
  if (!musicOn) startMusic();
  const hint = document.getElementById('hint');
  if (hint) hint.style.display = 'none';
  window.removeEventListener('pointerdown', firstGesture);
  window.removeEventListener('keydown', firstGesture);
}
window.addEventListener('pointerdown', firstGesture);
window.addEventListener('keydown', firstGesture);

// Botón de música (no propaga al gesto global)
document.getElementById('music').addEventListener('pointerdown', e => {
  e.stopPropagation();
  const hint = document.getElementById('hint');
  if (hint) hint.style.display = 'none';
  toggleMusic();
});

// ─────────────────────────────────────────────
//  BUCLE PRINCIPAL
// ─────────────────────────────────────────────
let t = 0;
function frame() {
  t++;
  zoom += (targetZoom - zoom) * 0.055;
  const camAngle    = t * 0.00068;
  const universeAlpha = Math.max(0, Math.min(1, (0.62 - zoom) / 0.32));

  // Transform base a resolución del dispositivo (nitidez sin pixelado)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  // — Fondo fijo —
  drawStars(t);
  drawNebula();
  drawHeartConstellation(t);
  drawTextStars(t);

  // ── Zona con zoom ──────────────────────────
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  // Universo expandido
  if (universeAlpha > 0) {
    ctx.globalAlpha = universeAlpha;
    for (const dg of DISTANT_GALAXIES) {
      drawMiniGalaxy(cx+dg.dxm*cx, cy+dg.dym*cy, dg.scl, dg.hOff, t*dg.spd);
    }
    ctx.globalAlpha = 1;
  }

  // Galaxia principal
  drawGalaxy(t, camAngle);

  // Órbitas
  for (const o of ORBITS) drawOrbit(o.rxBase, o.rxBase*o.ryRatio, 0.12);
  drawOrbit(BELT_MIN+25, (BELT_MIN+25)*0.42, 0.06);

  // Asteroides
  drawAsteroids(t, BELT_MIN, BELT_MAX, camAngle);

  // Cometa de hielo (azul)
  {
    const ang = COMET_ICE.startAngle + t*COMET_ICE.speed + camAngle;
    const cpx = cx + Math.cos(ang)*COMET_ICE.rxBase;
    const cpy = cy + Math.sin(ang)*COMET_ICE.rxBase*COMET_ICE.ryRatio;
    drawComet(cpx, cpy, Math.atan2(Math.cos(ang)*COMET_ICE.ryRatio, -Math.sin(ang)), t, COMET_ICE.hue);
  }

  // Cometa de amor (rosa-magenta)
  {
    const ang = COMET_AMOR.startAngle + t*COMET_AMOR.speed + camAngle;
    const cpx = cx + Math.cos(ang)*COMET_AMOR.rxBase;
    const cpy = cy + Math.sin(ang)*COMET_AMOR.rxBase*COMET_AMOR.ryRatio;
    drawComet(cpx, cpy, Math.atan2(Math.cos(ang)*COMET_AMOR.ryRatio, -Math.sin(ang)), t, COMET_AMOR.hue, 1.2);
  }

  // Planetas y lunas
  for (const o of ORBITS) {
    const rx  = o.rxBase, ry = rx*o.ryRatio;
    const ang = o.startAngle + t*o.speed + camAngle;
    const px  = cx + Math.cos(ang)*rx;
    const py  = cy + Math.sin(ang)*ry;

    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath();
    ctx.ellipse(px+o.r*0.4, py+o.r*0.4, o.r, o.r*0.5, 0.3, 0, Math.PI*2); ctx.fill();

    o.drawFn(px, py, o.r, t);

    for (const m of (o.moons||[])) {
      const ma = ang*3 + t*m.speed;
      drawMoon(px+Math.cos(ma)*m.dist, py+Math.sin(ma)*m.dist*0.5, m.r);
    }
    if (o.creatures) {
      for (const id of o.creatures) {
        const ca  = ang + t*0.0018 + id*(Math.PI*2/3);
        const crd = o.r + 22;
        drawCreature(px+Math.cos(ca)*crd, py+Math.sin(ca)*crd*0.6, t, id);
      }
      spawnLove(px, py);
    }
  }

  updateLove();
  ctx.restore();
  // ── Fin zona zoom ──

  // Corazones y rosas flotantes en pantalla (encima de todo)
  updateCosmicRoses(t);
  updateCosmicHearts(t);

  requestAnimationFrame(frame);
}

frame();
</script>
