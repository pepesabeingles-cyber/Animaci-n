<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>∞</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); buildStars(); buildNebula(); });

// ─────────────────────────────────────────────
//  ZOOM — rueda del mouse + pellizco táctil
// ─────────────────────────────────────────────
let zoom = 1, targetZoom = 1;

window.addEventListener('wheel', e => {
  targetZoom *= e.deltaY > 0 ? 0.88 : 1.14;
  targetZoom  = Math.max(0.06, Math.min(2.2, targetZoom));
}, { passive: true });

let lastPinchDist = null;
function pinchDist(e) {
  return Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY
  );
}
canvas.addEventListener('touchstart',  e => { if (e.touches.length === 2) lastPinchDist = pinchDist(e); }, { passive: true });
canvas.addEventListener('touchmove',   e => {
  if (e.touches.length === 2 && lastPinchDist) {
    const d = pinchDist(e);
    targetZoom *= d / lastPinchDist;
    targetZoom  = Math.max(0.06, Math.min(2.2, targetZoom));
    lastPinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { lastPinchDist = null; }, { passive: true });

// ─────────────────────────────────────────────
//  CAPA 1 · ESTRELLAS (fondo fijo)
// ─────────────────────────────────────────────
let stars = [];
function buildStars() {
  stars = [];
  for (let i = 0; i < 800; i++) {
    const r = Math.random();
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r:     r < 0.6 ? 0.4 : r < 0.9 ? 0.8 : 1.4,
      alpha: 0.3 + Math.random() * 0.7,
      ts:    0.004 + Math.random() * 0.018,
      to:    Math.random() * Math.PI * 2,
      hue:   [200, 210, 220, 60, 30][Math.floor(Math.random() * 5)],
    });
  }
}
buildStars();

function drawStars(t) {
  for (const s of stars) {
    const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.ts + s.to));
    ctx.fillStyle = `hsla(${s.hue},80%,96%,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─────────────────────────────────────────────
//  CAPA 2 · NEBULOSAS (fondo fijo)
// ─────────────────────────────────────────────
let nebulaClouds = [];
function buildNebula() {
  nebulaClouds = [
    { x: cx * 0.3, y: cy * 0.4, rx: W * 0.35, ry: H * 0.25, hue: 260, a: 0.07 },
    { x: cx * 1.7, y: cy * 1.5, rx: W * 0.30, ry: H * 0.20, hue: 200, a: 0.06 },
    { x: cx * 1.1, y: cy * 0.6, rx: W * 0.20, ry: H * 0.30, hue: 300, a: 0.05 },
    { x: cx * 0.5, y: cy * 1.6, rx: W * 0.25, ry: H * 0.20, hue: 180, a: 0.05 },
  ];
}
buildNebula();

function drawNebula() {
  for (const n of nebulaClouds) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx, n.ry));
    g.addColorStop(0,   `hsla(${n.hue},70%,55%,${n.a})`);
    g.addColorStop(0.5, `hsla(${n.hue},60%,40%,${n.a * 0.4})`);
    g.addColorStop(1,   `hsla(${n.hue},50%,20%,0)`);
    ctx.save();
    ctx.scale(1, n.ry / n.rx);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(n.x, n.y * (n.rx / n.ry), n.rx, n.rx, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────
//  CAPA 3 · GALAXIA PRINCIPAL
// ─────────────────────────────────────────────
const GALAXY_PARTICLES = 2200;
let gparticles = [];

function buildGalaxy() {
  gparticles = [];
  const arms = 3;
  for (let i = 0; i < GALAXY_PARTICLES; i++) {
    const arm   = Math.floor(Math.random() * arms);
    const dist  = 30 + Math.pow(Math.random(), 1.4) * 340;
    const angle = (arm / arms) * Math.PI * 2
                + (dist / 340) * Math.PI * 3.5
                + (Math.random() - 0.5) * 0.7;
    const spread = (0.5 + Math.random() * 0.5) * (dist * 0.12);
    const ox = Math.cos(angle) * spread;
    const oy = Math.sin(angle) * spread * 0.4;
    const bright = dist < 80;
    gparticles.push({
      baseX: Math.cos(angle) * dist + ox,
      baseY: Math.sin(angle) * dist * 0.42 + oy,
      r:     bright ? 1.2 + Math.random() * 1 : 0.3 + Math.random() * 1.1,
      alpha: bright ? 0.7 + Math.random() * 0.3 : 0.2 + Math.random() * 0.6,
      hue:   bright ? 50  + Math.random() * 30
                    : [210, 220, 260, 280, 60][Math.floor(Math.random() * 5)],
      sat:   bright ? 80 : 60 + Math.random() * 40,
      lit:   bright ? 90 : 60 + Math.random() * 40,
      speed: 0.00008 + Math.random() * 0.00005,
    });
  }
}
buildGalaxy();

function drawGalaxy(t, camAngle = 0) {
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
  glow.addColorStop(0,    'rgba(255,240,180,0.55)');
  glow.addColorStop(0.15, 'rgba(255,200,100,0.25)');
  glow.addColorStop(0.4,  'rgba(180,130,255,0.12)');
  glow.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, 120, 0, Math.PI * 2);
  ctx.fill();

  for (const p of gparticles) {
    const rot = t * p.speed + camAngle;
    const x = cx + p.baseX * Math.cos(rot) - p.baseY * Math.sin(rot);
    const y = cy + p.baseX * Math.sin(rot) + p.baseY * Math.cos(rot);
    ctx.fillStyle = `hsla(${p.hue},${p.sat}%,${p.lit}%,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
  core.addColorStop(0,   'rgba(255,255,220,1)');
  core.addColorStop(0.4, 'rgba(255,210,120,0.8)');
  core.addColorStop(1,   'rgba(255,150,50,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  ctx.fill();
}

// ─────────────────────────────────────────────
//  GALAXIAS DISTANTES (universo)
// ─────────────────────────────────────────────
// dxm/dym: multiplicadores sobre cx/cy para la posición en espacio mundo
const DISTANT_GALAXIES = [
  { dxm:  3.8, dym:  0.3, scl: 0.52, hOff:  50, spd: 0.00009, arms: 2 },
  { dxm: -3.4, dym: -0.7, scl: 0.38, hOff: -40, spd: 0.00013, arms: 3 },
  { dxm:  0.5, dym:  4.0, scl: 0.45, hOff:  95, spd: 0.00010, arms: 2 },
  { dxm: -0.6, dym: -3.8, scl: 0.33, hOff: -70, spd: 0.00015, arms: 4 },
  { dxm:  3.2, dym: -3.2, scl: 0.40, hOff: 130, spd: 0.00008, arms: 2 },
  { dxm: -3.0, dym:  3.4, scl: 0.48, hOff:-115, spd: 0.00011, arms: 3 },
  { dxm:  1.6, dym: -4.2, scl: 0.28, hOff: 200, spd: 0.00014, arms: 2 },
  { dxm: -4.2, dym:  1.4, scl: 0.36, hOff:-160, spd: 0.00009, arms: 2 },
  { dxm:  5.5, dym:  2.2, scl: 0.22, hOff: 170, spd: 0.00012, arms: 3 },
  { dxm: -5.0, dym: -2.5, scl: 0.25, hOff:-200, spd: 0.00010, arms: 2 },
];

function drawMiniGalaxy(gx, gy, scl, hOff, angle) {
  const R = 280 * scl;

  // halo exterior
  const halo = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
  halo.addColorStop(0,   `hsla(${50 + hOff},80%,70%,0.28)`);
  halo.addColorStop(0.4, `hsla(${220+hOff},60%,45%,0.10)`);
  halo.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(gx, gy, R, 0, Math.PI * 2);
  ctx.fill();

  // brazos espirales deterministas (sin random → sin parpadeo)
  for (let i = 0; i < 380; i++) {
    const arm  = i % 2;
    const frac = i / 380;
    const dist = (0.04 + frac * 0.95) * R;
    const a    = arm * Math.PI + frac * Math.PI * 4.2 + angle
               + Math.sin(i * 7.31) * 0.22;
    const sp   = Math.sin(i * 13.71) * dist * 0.10;
    const px   = gx + Math.cos(a) * dist + sp;
    const py   = gy + Math.sin(a) * dist * 0.36 + Math.cos(i * 13.71) * sp * 0.3;
    const al   = (0.18 + frac * 0.55) * scl;
    const hue  = frac > 0.6 ? 200 + hOff : 50 + hOff;
    ctx.fillStyle = `hsla(${hue},70%,80%,${al})`;
    ctx.fillRect(px - 0.8, py - 0.8, 1.6, 1.6);
  }

  // núcleo
  const core = ctx.createRadialGradient(gx, gy, 0, gx, gy, 16 * scl);
  core.addColorStop(0,   `hsla(${50+hOff},100%,98%,0.95)`);
  core.addColorStop(0.6, `hsla(${40+hOff},80%,70%,0.40)`);
  core.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(gx, gy, 16 * scl, 0, Math.PI * 2);
  ctx.fill();
}

// ─────────────────────────────────────────────
//  UTILIDADES
// ─────────────────────────────────────────────
function circle(x, y, r, fill, stroke, sw = 1) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill)   { ctx.fillStyle   = fill;   ctx.fill();   }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function glowAt(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0,   color.replace(')', ',0.5)').replace('hsl', 'hsla'));
  g.addColorStop(0.5, color.replace(')', ',0.15)').replace('hsl', 'hsla'));
  g.addColorStop(1,   color.replace(')', ',0)').replace('hsl', 'hsla'));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

// ─────────────────────────────────────────────
//  CAPA 4 · PLANETAS
// ─────────────────────────────────────────────
function drawVolcanic(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.1, px, py, r);
  g.addColorStop(0, '#ff6a00'); g.addColorStop(0.4, '#c83200');
  g.addColorStop(0.8, '#6b1800'); g.addColorStop(1, '#2a0800');
  circle(px, py, r, g);
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  ctx.strokeStyle = `rgba(255,${100+80*Math.sin(t*0.002)},0,0.7)`;
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const a = (i/5)*Math.PI*2 + t*0.0003;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px+Math.cos(a+0.5)*r*0.6, py+Math.sin(a+0.5)*r*0.6,
                         px+Math.cos(a)*r*0.95,     py+Math.sin(a)*r*0.95);
    ctx.stroke();
  }
  ctx.restore();
  glowAt(px, py, r*2.2, 'hsl(20,100%,50%)');
}

function drawOcean(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0, '#4adde8'); g.addColorStop(0.3, '#1a8fbf');
  g.addColorStop(0.7, '#0a4a8a'); g.addColorStop(1, '#040f3a');
  circle(px, py, r, g);
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  const continents = [{ox:-0.15,oy:-0.2,w:0.45,h:0.38},{ox:0.2,oy:0.1,w:0.35,h:0.30},{ox:-0.4,oy:0.3,w:0.28,h:0.22}];
  for (const c of continents) {
    const lg = ctx.createRadialGradient(px+c.ox*r, py+c.oy*r, 0, px+c.ox*r, py+c.oy*r, c.w*r);
    lg.addColorStop(0, '#4a8c3f'); lg.addColorStop(0.5, '#2d6e28'); lg.addColorStop(1, 'transparent');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.ellipse(px+c.ox*r, py+c.oy*r, c.w*r, c.h*r, 0.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.55;
  for (let i = 0; i < 4; i++) {
    const ca = (i/4)*Math.PI*2 + t*0.0004;
    const cg = ctx.createRadialGradient(px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, 0,
                                        px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, r*0.28);
    cg.addColorStop(0, 'rgba(255,255,255,0.8)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(px+Math.cos(ca)*r*0.5, py+Math.sin(ca)*r*0.3, r*0.28, r*0.12, ca, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  glowAt(px, py, r*2.0, 'hsl(200,100%,60%)');
  const atm = ctx.createRadialGradient(px, py, r*0.85, px, py, r*1.08);
  atm.addColorStop(0, 'rgba(100,200,255,0)'); atm.addColorStop(1, 'rgba(100,200,255,0.25)');
  circle(px, py, r*1.08, atm);
}

function drawGasGiant(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.25, py-r*0.3, r*0.1, px, py, r);
  g.addColorStop(0, '#f5d78e'); g.addColorStop(0.2, '#e8a850');
  g.addColorStop(0.5, '#c97030'); g.addColorStop(0.8, '#8a4010'); g.addColorStop(1, '#3a1800');
  circle(px, py, r, g);
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  for (const b of [{oy:-0.55,h:0.18,a:0.35},{oy:-0.25,h:0.14,a:0.25},{oy:0.05,h:0.20,a:0.30},{oy:0.38,h:0.15,a:0.28}]) {
    ctx.fillStyle = `rgba(0,0,0,${b.a})`;
    ctx.fillRect(px-r, py+b.oy*r, r*2, b.h*r);
  }
  const gsx = px + Math.cos(t*0.0002)*r*0.3;
  ctx.fillStyle = 'rgba(180,80,30,0.45)';
  ctx.beginPath();
  ctx.ellipse(gsx, py+r*0.1, r*0.22, r*0.13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(px, py); ctx.scale(1, 0.28);
  for (let ri = 0; ri < 3; ri++) {
    ctx.strokeStyle = `rgba(200,160,90,${0.35-ri*0.08})`;
    ctx.lineWidth = r*(0.14-ri*0.02);
    ctx.beginPath();
    ctx.arc(0, 0, r*(1.5+ri*0.22), 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
  glowAt(px, py, r*2.5, 'hsl(35,80%,50%)');
}

function drawIce(px, py, r, t) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0, '#e8f8ff'); g.addColorStop(0.3, '#90d8f5');
  g.addColorStop(0.7, '#3090c0'); g.addColorStop(1, '#082040');
  circle(px, py, r, g);
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = 'rgba(240,250,255,0.8)';
  ctx.beginPath(); ctx.ellipse(px, py-r*0.72, r*0.55, r*0.32, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px, py+r*0.78, r*0.45, r*0.25, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,230,255,0.5)'; ctx.lineWidth = 0.8;
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+Math.cos(a)*r, py+Math.sin(a)*r); ctx.stroke();
  }
  ctx.restore();
  glowAt(px, py, r*1.9, 'hsl(195,90%,70%)');
}

function drawMoon(px, py, r) {
  const g = ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.05, px, py, r);
  g.addColorStop(0, '#d0d0c8'); g.addColorStop(0.6, '#909088'); g.addColorStop(1, '#404038');
  circle(px, py, r, g);
  ctx.fillStyle = 'rgba(40,40,35,0.35)';
  for (const c of [{ox:0.2,oy:-0.25,r:0.2},{ox:-0.3,oy:0.1,r:0.14},{ox:0.1,oy:0.3,r:0.12}]) {
    ctx.beginPath(); ctx.arc(px+c.ox*r, py+c.oy*r, c.r*r, 0, Math.PI*2); ctx.fill();
  }
}

function drawComet(px, py, angle, t) {
  const tailLen = 90 + 30*Math.sin(t*0.002);
  const td = angle + Math.PI;
  const grad = ctx.createLinearGradient(px, py, px+Math.cos(td)*tailLen, py+Math.sin(td)*tailLen);
  grad.addColorStop(0,   'rgba(180,230,255,0.7)');
  grad.addColorStop(0.4, 'rgba(100,180,255,0.3)');
  grad.addColorStop(1,   'rgba(50,100,255,0)');
  ctx.save();
  ctx.lineWidth = 6; ctx.strokeStyle = grad; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px, py);
  ctx.lineTo(px+Math.cos(td)*tailLen, py+Math.sin(td)*tailLen);
  ctx.stroke();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(200,240,255,0.25)';
  ctx.beginPath(); ctx.moveTo(px, py);
  ctx.lineTo(px+Math.cos(td+0.15)*tailLen*0.7, py+Math.sin(td+0.15)*tailLen*0.7);
  ctx.stroke();
  ctx.restore();
  glowAt(px, py, 16, 'hsl(200,100%,80%)');
  circle(px, py, 4, '#d0f0ff');
}

function drawCreature(px, py, t, id) {
  const flap = Math.sin(t*0.003 + id*1.7)*0.5 + 0.5;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = `hsla(${160+id*40},80%,70%,0.7)`;
  ctx.beginPath(); ctx.ellipse(-5*(0.3+flap*0.7), -2, 7*(0.4+flap*0.6), 4, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 5*(0.3+flap*0.7), -2, 7*(0.4+flap*0.6), 4,  0.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = `hsla(${200+id*30},60%,80%,0.9)`;
  ctx.beginPath(); ctx.ellipse(0, 0, 2, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ─────────────────────────────────────────────
//  CINTURÓN DE ASTEROIDES
// ─────────────────────────────────────────────
let asteroids = [];
function buildAsteroids() {
  asteroids = [];
  for (let i = 0; i < 160; i++) {
    asteroids.push({
      angle: Math.random() * Math.PI * 2,
      dist:  0.92 + Math.random() * 0.16,
      size:  0.8 + Math.random() * 2.0,
      speed: (0.00012 + Math.random() * 0.0001) * (Math.random() < 0.5 ? 1 : -1),
      alpha: 0.5 + Math.random() * 0.5,
    });
  }
}
buildAsteroids();

function drawAsteroids(t, minR, maxR, camAngle) {
  for (const a of asteroids) {
    const r   = minR + a.dist * (maxR - minR);
    const ang = a.angle + t * a.speed + camAngle;
    ctx.fillStyle = `rgba(160,145,120,${a.alpha})`;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r*0.4, a.size, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawOrbit(rx, ry, alpha = 0.1) {
  ctx.strokeStyle = `rgba(140,160,200,${alpha})`;
  ctx.lineWidth = 0.5; ctx.setLineDash([3, 8]);
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
}

// ─────────────────────────────────────────────
//  PARTÍCULAS DE VIDA
// ─────────────────────────────────────────────
let lifeParticles = [];
function spawnLife(px, py) {
  for (let i = 0; i < 2; i++) {
    lifeParticles.push({
      x: px + (Math.random()-0.5)*20, y: py + (Math.random()-0.5)*20,
      vx: (Math.random()-0.5)*0.4,    vy: (Math.random()-0.5)*0.4,
      life: 1, hue: 120 + Math.random()*80,
    });
  }
}
function updateLife() {
  lifeParticles = lifeParticles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.008;
    return p.life > 0;
  });
  for (const p of lifeParticles) {
    ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.life*0.6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
  }
}

// ─────────────────────────────────────────────
//  DEFINICIÓN DE ÓRBITAS
// ─────────────────────────────────────────────
const ORBITS = [
  { rxBase: 155, ryRatio: 0.42, speed: 0.00060, startAngle: 0.5, r: 13, drawFn: drawVolcanic, moons: [] },
  { rxBase: 250, ryRatio: 0.42, speed: 0.00037, startAngle: 2.1, r: 18, drawFn: drawOcean,
    moons: [{ dist: 32, speed: 0.0028, r: 5 }], creatures: [0, 1, 2] },
  { rxBase: 390, ryRatio: 0.42, speed: 0.00020, startAngle: 4.2, r: 28, drawFn: drawGasGiant,
    moons: [{ dist: 48, speed: 0.0020, r: 6 }, { dist: 68, speed: 0.0014, r: 4 }] },
  { rxBase: 510, ryRatio: 0.42, speed: 0.00012, startAngle: 1.0, r: 15, drawFn: drawIce,
    moons: [{ dist: 28, speed: 0.0025, r: 5 }] },
];
const COMET    = { rxBase: 600, ryRatio: 0.15, speed: 0.00055, startAngle: 3.1 };
const BELT_MIN = 315, BELT_MAX = 365;

// ─────────────────────────────────────────────
//  BUCLE PRINCIPAL
// ─────────────────────────────────────────────
let t = 0;
function frame() {
  t++;
  zoom += (targetZoom - zoom) * 0.055;

  // Rotación global (3× más rápida que antes)
  const camAngle = t * 0.00068;

  // Alpha de aparición del universo (empieza a verse al alejarse)
  const universeAlpha = Math.max(0, Math.min(1, (0.62 - zoom) / 0.32));

  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);

  // — Fondo fijo: estrellas y nebulosas —
  drawStars(t);
  drawNebula();

  // ── Zona con zoom ──────────────────────────
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  // Universo: galaxias distantes (aparecen al alejarse)
  if (universeAlpha > 0) {
    ctx.globalAlpha = universeAlpha;
    for (const dg of DISTANT_GALAXIES) {
      const gx = cx + dg.dxm * cx;
      const gy = cy + dg.dym * cy;
      drawMiniGalaxy(gx, gy, dg.scl, dg.hOff, t * dg.spd);
    }
    ctx.globalAlpha = 1;
  }

  // Galaxia principal
  drawGalaxy(t, camAngle);

  // Órbitas
  for (const o of ORBITS) drawOrbit(o.rxBase, o.rxBase * o.ryRatio, 0.12);
  drawOrbit(BELT_MIN+25, (BELT_MIN+25)*0.42, 0.06);

  // Cinturón de asteroides
  drawAsteroids(t, BELT_MIN, BELT_MAX, camAngle);

  // Cometa
  {
    const rx  = COMET.rxBase, ry = rx * COMET.ryRatio;
    const ang = COMET.startAngle + t * COMET.speed + camAngle;
    const cpx = cx + Math.cos(ang)*rx, cpy = cy + Math.sin(ang)*ry;
    drawComet(cpx, cpy, Math.atan2(Math.cos(ang)*COMET.ryRatio, -Math.sin(ang)), t);
  }

  // Planetas, lunas y criaturas
  for (const o of ORBITS) {
    const rx  = o.rxBase, ry = rx * o.ryRatio;
    const ang = o.startAngle + t * o.speed + camAngle;
    const px  = cx + Math.cos(ang)*rx;
    const py  = cy + Math.sin(ang)*ry;

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(px+o.r*0.4, py+o.r*0.4, o.r, o.r*0.5, 0.3, 0, Math.PI*2);
    ctx.fill();

    o.drawFn(px, py, o.r, t);

    for (const m of (o.moons || [])) {
      const ma = ang*3 + t*m.speed;
      drawMoon(px+Math.cos(ma)*m.dist, py+Math.sin(ma)*m.dist*0.5, m.r);
    }

    if (o.creatures) {
      for (const id of o.creatures) {
        const ca  = ang + t*0.0018 + id*(Math.PI*2/3);
        const crd = o.r + 22;
        drawCreature(px+Math.cos(ca)*crd, py+Math.sin(ca)*crd*0.6, t, id);
      }
      spawnLife(px, py);
    }
  }

  updateLife();
  ctx.restore();
  // ── Fin zona con zoom ──────────────────────

  requestAnimationFrame(frame);
}

frame();
</script>
